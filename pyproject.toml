[project]
name = "cryptomodel"
version = "0.1.0"
description = "Self-supervised foundation model over Ethereum token-launch events"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cryptomodel"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "mypy>=2.4.1",
    "pycryptodome>=4.6.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
    "net: reads real data over the network; skipped unless CRYPTOMODEL_NET_TESTS=1",
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyarrow.*", "duckdb.*", "Crypto.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]
